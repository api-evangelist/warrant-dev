aid: warrant-dev
url: https://raw.githubusercontent.com/api-evangelist/warrant-dev/refs/heads/main/apis.yml
name: Warrant
kind: company
description: >-
  Warrant was a centralized, fine-grained authorization (FGA) and access control
  service inspired by Google Zanzibar, exposing a real-time REST API to define an
  authorization model, store relationships (warrants) between objects, and run
  low-latency access checks and queries. It supported relationship-based (ReBAC),
  role-based (RBAC), and attribute-based (ABAC) access control, plus entitlements
  such as pricing tiers and feature gating. The core engine is open source
  (Apache-2.0, github.com/warrant-dev/warrant) and self-hostable. Warrant was
  acquired by WorkOS on 2024-04-23 and folded into WorkOS FGA; the standalone
  hosted Warrant service (api.warrant.dev) and the Warrant-based WorkOS FGA were
  deprecated and sunset on 2025-11-15. This entry documents Warrant's public API
  surface historically - the endpoints modeled here reflect the documented
  api.warrant.dev v1/v2 API and are RETIRED. Current fine-grained authorization
  is offered through WorkOS; the open-source engine remains self-hostable.
