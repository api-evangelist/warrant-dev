apis:
- aid: warrant-dev:warrant-dev-objects-api
  name: Warrant Objects API
  tags:
  - Access Control
  - Objects
  - Resources
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://github.com/warrant-dev/warrant
  baseURL: https://api.warrant.dev/v1
  properties:
  - url: https://github.com/warrant-dev/warrant
    type: Documentation
  - url: https://workos.com/docs/fga
    type: APIReference
  - url: openapi/warrant-dev-openapi.yml
    type: OpenAPI
  description: >-
    Create, list, get, update, and delete the objects (resources and subjects -
    users, tenants, documents, folders, roles, etc.) that participate in the
    authorization model. Objects are identified by an object type and an object
    id and can carry arbitrary metadata. RETIRED - modeled from the documented
    api.warrant.dev v1 API; the standalone hosted service was sunset 2025-11-15.
- aid: warrant-dev:warrant-dev-warrants-api
  name: Warrant Relationships (Warrants) API
  tags:
  - Access Control
  - Authorization
  - Relationships
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://workos.com/docs/fga/warrants
  baseURL: https://api.warrant.dev/v1
  properties:
  - url: https://workos.com/docs/fga/warrants
    type: Documentation
  - url: openapi/warrant-dev-openapi.yml
    type: OpenAPI
  description: >-
    Manage warrants - the access rules that assign a relation between a subject
    and an object (for example "user:1 is editor of document:xyz" or
    "role:admin is member of tenant:acme"). Create, list, query, and delete
    warrants; warrants are the Zanzibar-style relationship tuples the check
    engine evaluates. RETIRED - modeled from the documented api.warrant.dev v1
    API.
- aid: warrant-dev:warrant-dev-check-api
  name: Warrant Check (Authorization) API
  tags:
  - Access Control
  - Authorization
  - Fine-Grained Authorization
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://workos.com/docs/fga
  baseURL: https://api.warrant.dev
  properties:
  - url: https://workos.com/docs/fga
    type: Documentation
  - url: openapi/warrant-dev-openapi.yml
    type: OpenAPI
  description: >-
    The real-time, low-latency authorization surface. Check whether a subject
    has a given permission or relation on an object (POST /v2/authorize) and run
    relationship queries with the Warrant Query Language to enumerate access
    (GET /v1/query). This is the hot-path API applications called on every
    access decision. RETIRED - modeled from the documented api.warrant.dev
    v1/v2 API.
- aid: warrant-dev:warrant-dev-object-types-api
  name: Warrant Object Types API
  tags:
  - Access Control
  - Object Types
  - Authorization Model
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://workos.com/docs/fga/resource-types
  baseURL: https://api.warrant.dev/v1
  properties:
  - url: https://workos.com/docs/fga/resource-types
    type: Documentation
  - url: openapi/warrant-dev-openapi.yml
    type: OpenAPI
  description: >-
    Define and manage the authorization model itself - the object (resource)
    types and the relations between them, including inheritance and implication
    rules (for example a document inherits editor from its parent folder).
    Create, list, get, update, and delete object types. RETIRED - modeled from
    the documented api.warrant.dev v1 API.
- aid: warrant-dev:warrant-dev-roles-permissions-api
  name: Warrant Roles & Permissions API
  tags:
  - Access Control
  - RBAC
  - Roles
  - Permissions
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://workos.com/docs/fga
  baseURL: https://api.warrant.dev/v1
  properties:
  - url: https://workos.com/docs/fga
    type: Documentation
  - url: openapi/warrant-dev-openapi.yml
    type: OpenAPI
  description: >-
    Convenience RBAC and entitlements surface built on top of objects and
    warrants - manage roles, permissions, users, tenants, features, and pricing
    tiers, and assign them to each other (assign a permission to a role, a role
    to a user, a user to a tenant, a feature to a pricing tier). RETIRED -
    modeled from the documented api.warrant.dev v1 API.
