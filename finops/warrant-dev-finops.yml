description: >-
  FinOps view of Warrant spend. Warrant's core authorization engine is open
  source (Apache-2.0) and free to self-host - in that model the cost is your own
  compute, storage, and the backing datastore (MySQL, Postgres, or SQLite) that
  runs the Warrant service, with no vendor invoice. The hosted Warrant Cloud was
  billed on a usage basis driven by authorization activity (objects and warrants
  stored, plus access checks performed), above a free developer allowance.
  RETIRED - Warrant was acquired by WorkOS (2024-04-23) and the hosted service
  was sunset 2025-11-15; hosted per-unit rates were not reconciled. Current
  fine-grained authorization spend is invoiced by WorkOS.
notes: >-
  Hosted per-unit rates are not reconciled and the hosted service is retired.
  For current pricing, evaluate WorkOS FGA. For self-hosted deployments, the
  dominant costs are infrastructure (the Warrant service plus its datastore),
  not a Warrant license fee.
