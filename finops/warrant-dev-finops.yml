meters:
- name: access_checks
  description: Authorization checks performed (POST /v2/authorize), historically the primary billed unit on Warrant Cloud.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - objectType
- name: warrants_stored
  description: Relationship tuples (warrants) stored in the authorization model.
  unit: count
  aggregation: max
  dimensions:
  - account
  - objectType
- name: objects_stored
  description: Objects (resources and subjects) stored in the authorization model.
  unit: count
  aggregation: max
  dimensions:
  - account
  - objectType
- name: self_hosted_compute
  description: Infrastructure cost of running the self-hosted Warrant service and its datastore (no Warrant invoice).
  unit: hours
  aggregation: sum
  dimensions:
  - deployment
principles:
- name: Visibility
  description: Track access-check volume and stored objects/warrants per account and object type; on self-hosted, monitor the Warrant service and datastore infrastructure costs.
- name: Allocation
  description: Name object types and tenants per workload/team so authorization activity maps to internal cost centers.
- name: Optimization
  description: Cache authorization decisions client-side to reduce check volume; prune stale warrants and objects; self-host the open-source engine to trade vendor fees for owned infrastructure.
- name: Accountability
  description: Assign owners per tenant/object type; review monthly check volume against plan allowances or self-hosted infrastructure budget.
