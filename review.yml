actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on Warrant's API, and the service is
    retired. Warrant's public API is request/response REST (v1 management + v2
    /authorize check). No AsyncAPI document was created because there is no
    server-push transport to model and the hosted service was sunset on
    2025-11-15.
